# Render blueprint for the API (free plan). The database lives on Neon; set DATABASE_URL in the dashboard.
services:
  - type: web
    name: clinic-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to Chennai; create the Neon database in Singapore too
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # your Vercel URL, e.g. https://your-site.vercel.app
      - key: ENABLE_DOCS
        value: "true" # the portfolio demo shows its API docs; set to false (or remove) for a real clinic
      - key: CRON_SECRET
        generateValue: true # lets an outside pinger call /api/v1/cron/reminders when the free host sleeps
      - key: DISABLE_DEMO_LOGIN
        value: "true" # the public demo login is off; real staff sign in with their own accounts
